<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komal Academy | Home</title>

<style>
/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* Body & Background */
body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(135deg, #e0f0ff, #d0e7ff);
    transition: 0.3s;
}

/* Dark Mode */
body.dark {
    background: #0f172a;
    color: white;
}

/* Dark Mode Toggle Button */
.dark-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 8px 12px;
    border: none;
    border-radius: 20px;
    background: white;
    cursor: pointer;
    transition: 0.3s;
}

body.dark .dark-toggle {
    background: #334155;
    color: white;
}

/* Page Title */
.page-title {
    margin-top: 60px;
    text-align: center;
}

.page-title h1 {
    font-size: 36px;
    color: #007BFF;
    margin-bottom: 10px;
}

body.dark .page-title h1 {
    color: #38bdf8;
}

.page-title p {
    font-size: 18px;
    color: #555;
}

body.dark .page-title p {
    color: #cbd5e1;
}

/* Panels Container */
.panel-container {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center;
    align-items: center;
    margin-top: 40px;
    margin-bottom: 60px;
}

/* Panel Cards */
.panel {
    width: 220px;
    height: 140px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
}

/* Hover effect */
.panel:hover {
    transform: scale(1.05);
    box-shadow: 0 12px 25px rgba(0,0,0,0.3);
}

/* Panel Colors */
.student-panel {
    background: linear-gradient(135deg, #007BFF, #00BFFF);
}

.teacher-panel {
    background: linear-gradient(135deg, #6a0dad, #9b30ff);
}

.admissions-panel {
    background: linear-gradient(135deg, #28a745, #5cd65c);
}

/* Dark mode panel adjustment */
body.dark .student-panel {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
}
body.dark .teacher-panel {
    background: linear-gradient(135deg, #4c1d95, #7c3aed);
}
body.dark .admissions-panel {
    background: linear-gradient(135deg, #166534, #16a34a);
}

/* Responsive */
@media (max-width: 700px) {
    .panel-container {
        flex-direction: column;
    }
}
</style>
</head>
<body>

<!-- Dark Mode Toggle -->
<button id="darkToggle" class="dark-toggle">🌙</button>

<!-- Page Title -->
<div class="page-title">
    <h1>Welcome to Komal Academy</h1>
    <p>Select a panel to continue</p>
</div>

<!-- Panels -->
<div class="panel-container">
    <div class="panel student-panel" onclick="location.href='student-panel.html'">Student Panel</div>
    <div class="panel teacher-panel" onclick="location.href='teacher-panel.html'">Teacher Panel</div>
    <div class="panel admissions-panel" onclick="location.href='admissions.html'">Admissions Panel</div>
</div>

<script>
// Dark Mode Toggle
document.getElementById("darkToggle").addEventListener("click", function() {
    document.body.classList.toggle("dark");
});
</script>

</body>
</html>
