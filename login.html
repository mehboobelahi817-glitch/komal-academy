<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Komal Academy</title>

<style>
/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* Full screen background */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #007BFF, #00BFFF);
    transition: 0.3s;
}

/* Dark Mode */
body.dark {
    background: #0f172a;
    color: white;
}

/* Login Card */
.login-container {
    background: white;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
    width: 90%;
    max-width: 400px;
    transition: 0.3s;
}

body.dark .login-container {
    background: #1e293b;
}

/* Logo */
.logo {
    width: 90px;
    margin-bottom: 15px;
}

/* Title */
h1 {
    margin-bottom: 20px;
    color: #007BFF;
}

body.dark h1 {
    color: #38bdf8;
}

/* Inputs */
input, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
}

/* Button */
.login-btn {
    width: 100%;
    padding: 12px;
    background: #007BFF;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
}

.login-btn:hover {
    background: #0056b3;
}

/* Dark toggle */
.dark-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 8px 12px;
    border: none;
    border-radius: 20px;
    background: white;
    cursor: pointer;
}

body.dark .dark-toggle {
    background: #334155;
    color: white;
}
</style>
</head>

<body>

<!-- Dark Mode Toggle -->
<button id="darkToggle" class="dark-toggle">🌙</button>

<div class="login-container">

    <!-- Logo -->
    <img src="assets/logo.jpg" alt="Komal Academy Logo" class="logo">

    <h1>Login to Komal Academy</h1>

    <form id="loginForm">

        <input type="text" placeholder="Enter Your Name" required>

        <select required>
            <option value="">Select Role</option>
            <option value="student">Student</option>
            <option value="parent">Parent</option>
        </select>

        <select required>
            <option value="">Select Class</option>
            <option value="9">Class 9</option>
            <option value="10">Class 10</option>
        </select>

        <button type="submit" class="login-btn">Login</button>

    </form>

</div>

<script>
// Redirect to Home Page
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    window.location.href = "index.html";
});

// Dark Mode Toggle
document.getElementById("darkToggle").addEventListener("click", function() {
    document.body.classList.toggle("dark");
});
</script>

</body>
</html>
