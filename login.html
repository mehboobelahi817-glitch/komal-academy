<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login to Komal Academy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Dark mode variables */
        :root {
            --bg-light: linear-gradient(135deg, #006400, #000000);
            --bg-dark: #111111;
            --card-light: rgba(255, 255, 255, 0.95);
            --card-dark: #222222;
            --text-light: #006400;
            --text-dark: #00ff00;
            --button-light: #006400;
            --button-dark: #00cc00;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-light);
            transition: background 0.3s;
        }

        body.dark-mode {
            background: var(--bg-dark);
        }

        .login-container {
            background: var(--card-light);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            text-align: center;
            width: 90%;
            max-width: 400px;
            transition: background 0.3s;
        }

        body.dark-mode .login-container {
            background: var(--card-dark);
        }

        .login-container img {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
        }

        .login-container h2 {
            margin-bottom: 20px;
            color: var(--text-light);
            transition: color 0.3s;
        }

        body.dark-mode .login-container h2 {
            color: var(--text-dark);
        }

        .login-container input,
        .login-container select,
        .login-container button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .login-container button {
            background-color: var(--button-light);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        body.dark-mode .login-container button {
            background-color: var(--button-dark);
        }

        .login-container button:hover {
            opacity: 0.9;
        }

        /* Dark mode toggle button */
        .dark-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Dark mode toggle -->
    <button class="dark-toggle" onclick="toggleDarkMode()">Toggle Dark Mode</button>

    <div class="login-container">
        <!-- Logo -->
        <img src="assets/logo.jpg" alt="Komal Academy Logo">

        <h2>Login to Komal Academy</h2>

        <!-- Login Form -->
        <form id="loginForm">
            <!-- Name -->
            <input type="text" id="name" placeholder="Your Name" required>

            <!-- Role -->
            <select id="role" required>
                <option value="">Select Role</option>
                <option value="student">Student</option>
                <option value="parent">Parent</option>
            </select>

            <!-- Class Dropdown -->
            <select id="class" required>
                <option value="">Select Class</option>
                <option value="playgroup">Playgroup</option>
                <option value="prep">Prep</option>
                <option value="class1">Class 1</option>
                <option value="class2">Class 2</option>
                <option value="class3">Class 3</option>
                <option value="class4">Class 4</option>
                <option value="class5">Class 5</option>
                <option value="class6">Class 6</option>
                <option value="class7">Class 7</option>
                <option value="class8">Class 8</option>
                <option value="class9">Class 9</option>
                <option value="class10">Class 10</option>
                <option value="matric">Matric</option>
            </select>

            <!-- Submit Button -->
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        // Dark mode toggle function
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        // Redirect to index.html after submit
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault(); // prevent default reload
            // Optional: Add JS validation here
            window.location.href = "index.html";
        };
    </script>
</body>
</html>
